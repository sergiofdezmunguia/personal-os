[project]
name = "personal-os"
version = "0.1.0"
description = "Personal OS: capa de inteligencia, automatización y coordinación sobre las apps nativas de Apple."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "icalendar>=6.0",
    "python-dateutil>=2.9",
    "mcp>=1.10",
    "pyrage>=1.2",
    "xlrd>=2.0",
    "pdfplumber>=0.11",
]

[project.scripts]
pos = "personal_os.cli.main:app"
pos-mcp = "personal_os.mcp_server.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "import-linter>=2.1",
    "xlwt>=1.3",
    "reportlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: integración real contra servicios externos (iCloud). Requiere POS_LIVE=1 y credenciales locales.",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # E501: lo gestiona `ruff format`; RUF00x: textos en español

[tool.ruff.lint.per-file-ignores]
"src/personal_os/cli/*" = ["B008"]  # patrón estándar de Typer

# Fronteras arquitectónicas. Ver CLAUDE.md y docs/adr/.
[tool.importlinter]
root_package = "personal_os"

[[tool.importlinter.contracts]]
name = "Capas: interfaces (cli | mcp) -> ops -> bootstrap -> adapters -> sync -> dominio -> core"
type = "layers"
layers = [
    "personal_os.cli | personal_os.mcp_server",
    "personal_os.ops",
    "personal_os.bootstrap",
    "personal_os.adapters",
    "personal_os.sync",
    "personal_os.tasks | personal_os.calendar | personal_os.finance",
    "personal_os.core",
]

[[tool.importlinter.contracts]]
name = "Los adaptadores no conocen el dominio (solo los ports/DTOs de sync)"
type = "forbidden"
source_modules = ["personal_os.adapters"]
forbidden_modules = ["personal_os.tasks", "personal_os.calendar", "personal_os.finance"]
